<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>클릭 게임</title>

    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
</head>

<body>

<div class="page">

    <header>
        <a href="index.html">장소 탐험으로 돌아가기</a>

        <h1>클릭해서 점수 얻기</h1>

        <p>
            화면에 나타나는 목표를 클릭하면 점수를 얻습니다.
        </p>
    </header>


    <main>

        <section class="panel">

            <p>
                점수: <strong id="score">0</strong>
            </p>

            <p>
                남은 시간: <strong id="time">20</strong>초
            </p>

            <button id="startButton" type="button">
                게임 시작
            </button>

        </section>


        <canvas id="gameCanvas"
                width="700"
                height="450">
        </canvas>


        <section class="panel">

            <p id="message">
                게임 시작 버튼을 눌러주세요.
            </p>

            <button id="restartButton"
                    type="button"
                    hidden>
                다시 시작
            </button>

        </section>

    </main>


    <footer>
        <p>Week 4 · JavaScript 실습 3</p>
    </footer>

</div>

</body>
</html>
